<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Элмира & Нурбек — Үйлөнүү тою</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap');

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --cream:#f8f2e8;
  --paper:#fffaf3;
  --gold:#b28a45;
  --gold2:#d7b878;
  --brown:#4b392b;
}

body{
  background:var(--cream);
  color:var(--brown);
  font-family:'Montserrat',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

/* ЭКРАН 1 — КОНВЕРТ */
#opening{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
  position:relative;
  overflow:hidden;
}

.envelope{
  width:min(390px,92vw);
  height:270px;
  position:relative;
  perspective:1200px;
}

.envelope-body{
  position:absolute;
  inset:0;
  background:linear-gradient(145deg,#ead7b5,#c9a86b);
  border-radius:5px;
  box-shadow:0 20px 50px rgba(76,55,30,.25);
  overflow:hidden;
}

.envelope-body:before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(35deg,transparent 49%,rgba(255,255,255,.25) 50%,transparent 51%),
    linear-gradient(-35deg,transparent 49%,rgba(255,255,255,.25) 50%,transparent 51%);
}

.flap{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:145px;
  background:linear-gradient(145deg,#e5ce9f,#b9904d);
  clip-path:polygon(0 0,100% 0,50% 100%);
  transform-origin:top center;
  transition:transform 1s cubic-bezier(.2,.8,.2,1);
  z-index:5;
}

.envelope.open .flap{
  transform:rotateX(180deg);
}

.seal{
  position:absolute;
  z-index:10;
  left:50%;
  top:105px;
  transform:translateX(-50%);
  width:62px;
  height:62px;
  border-radius:50%;
  background:#a97932;
  border:3px solid #f1d99e;
  color:#fff7e5;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Cormorant Garamond',serif;
  font-size:29px;
  box-shadow:0 5px 15px rgba(0,0,0,.2);
  transition:opacity .5s,transform .5s;
}

.envelope.open .seal{
  opacity:0;
  transform:translateX(-50%) scale(.3);
}

.letter{
  position:absolute;
  z-index:6;
  left:18px;
  right:18px;
  top:25px;
  height:220px;
  background:var(--paper);
  border:1px solid var(--gold2);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
  transition:transform 1.2s cubic-bezier(.2,.8,.2,1);
}

.envelope.open .letter{
  transform:translateY(-150px);
}

.letter-title{
  font-family:'Cormorant Garamond',serif;
  font-size:31px;
  color:var(--gold);
  margin-bottom:10px;
}

.letter-sub{
  font-size:16px;
}

.open-button{
  position:absolute;
  z-index:20;
  bottom:-75px;
  left:50%;
  transform:translateX(-50%);
  background:var(--gold);
  color:white;
  border:0;
  padding:14px 25px;
  border-radius:30px;
  font-family:'Montserrat',sans-serif;
  font-size:14px;
  box-shadow:0 8px 20px rgba(100,70,30,.2);
}

.envelope.open .open-button{
  opacity:0;
  pointer-events:none;
}

/* ЖАЛТЫРАГАН БӨЛҮКТӨР */
.sparkle{
  position:absolute;
  width:5px;
  height:5px;
  background:#d7b878;
  border-radius:50%;
  opacity:0;
}

.envelope.open ~ .sparkles .sparkle{
  animation:spark 2s ease-out forwards;
}

@keyframes spark{
  0%{opacity:0;transform:translateY(0) scale(.2)}
  30%{opacity:1}
  100%{opacity:0;transform:translateY(-180px) scale(1.5)}
}

/* НЕГИЗГИ БЕТ */
#main{
  display:none;
  min-height:100vh;
  animation:fadeIn 1.5s ease;
}

@keyframes fadeIn{
  from{opacity:0}
  to{opacity:1}
}

.hero{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:50px 20px;
  position:relative;
}

.small{
  letter-spacing:4px;
  text-transform:uppercase;
  font-size:12px;
  margin-bottom:25px;
  color:var(--gold);
}

.names{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(55px,15vw,90px);
  font-weight:500;
  color:var(--gold);
  line-height:.9;
}

.amp{
  font-size:.6em;
  color:var(--brown);
  margin:8px;
}

.date{
  margin-top:35px;
  font-family:'Cormorant Garamond',serif;
  font-size:27px;
}

.line{
  width:70px;
  height:1px;
  background:var(--gold2);
  margin:20px auto;
}

section{
  max-width:700px;
  margin:auto;
  padding:80px 25px;
  text-align:center;
}

.title{
  font-family:'Cormorant Garamond',serif;
  color:var(--gold);
  font-size:40px;
  margin-bottom:30px;
}

.text{
  font-size:15px;
  line-height:2;
}

.hosts{
  font-family:'Cormorant Garamond',serif;
  font-size:29px;
  margin-top:15px;
}

.info{
  display:grid;
  gap:18px;
}

.card{
  background:var(--paper);
  border:1px solid #e2cfaa;
  padding:25px;
  box-shadow:0 10px 25px rgba(80,55,25,.08);
}

.card b{
  display:block;
  font-family:'Cormorant Garamond',serif;
  font-size:25px;
  color:var(--gold);
  margin-bottom:8px;
}

.music{
  position:fixed;
  right:18px;
  top:18px;
  z-index:100;
  width:48px;
  height:48px;
  border-radius:50%;
  border:1px solid var(--gold2);
  background:var(--paper);
  color:var(--gold);
  font-size:20px;
}

.footer{
  padding:80px 20px;
  text-align:center;
  font-family:'Cormorant Garamond',serif;
  font-size:25px;
  color:var(--gold);
}

.petals{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:90;
}

.petal{
  position:absolute;
  top:-30px;
  width:10px;
  height:16px;
  background:#e7c9bd;
  border-radius:70% 30% 70% 30%;
  animation:fall linear forwards;
  opacity:.8;
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(540deg);
  }
}

@media(max-width:500px){
  .envelope{
    height:245px;
  }

  .letter{
    height:200px;
  }

  .letter-title{
    font-size:27px;
  }

  .names{
    font-size:62px;
  }
}
</style>
</head>

<div id="opening">

  <div class="envelope" id="envelope">

    <div class="envelope-body"></div>

    <div class="letter">
      <div>
        <div class="letter-title">Элмира & Нурбек</div>
        <div class="letter-sub">Үйлөнүү тоюна чакырабыз</div>
      </div>
    </div>

    <div class="flap"></div>

    <div class="seal">E & N</div>

    <button class="open-button" onclick="openInvitation()">
      Чакырууны ачуу
    </button>

  </div>

  <div class="sparkles">
    <span class="sparkle" style="left:20%;top:60%"></span>
    <span class="sparkle" style="left:35%;top:70%"></span>
    <span class="sparkle" style="left:70%;top:65%"></span>
    <span class="sparkle" style="left:80%;top:50%"></span>
    <span class="sparkle" style="left:50%;top:75%"></span>
  </div>

</div>

  <button class="music" id="musicBtn" onclick="toggleMusic()">♫</button>

  <div class="petals" id="petals"></div>
