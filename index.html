<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f8f3ea">

<title>Чынгыз & Жазгүл</title>

<style>
:root{
  --cream:#faf6ee;
  --cream2:#f4ede1;
  --white:#fffdf9;
  --gold:#b08a45;
  --gold2:#d5b36a;
  --text:#6f5a3d;
  --dark:#493b29;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  background:var(--cream);
  color:var(--text);
  font-family:Georgia,"Times New Roman",serif;
  overflow-x:hidden;
}

button,
input,
select{
  font-family:inherit;
}

.music-btn{
  position:fixed;
  top:16px;
  right:16px;
  width:42px;
  height:42px;
  border-radius:50%;
  border:1px solid rgba(176,138,69,.6);
  background:rgba(255,253,249,.9);
  color:var(--gold);
  font-size:18px;
  z-index:1000;
  box-shadow:0 4px 15px rgba(80,60,30,.12);
}

section{
  padding:55px 15px;
}

.section-card{
  position:relative;
  width:100%;
  max-width:700px;
  min-height:570px;
  margin:auto;
  border:1px solid rgba(176,138,69,.65);
  border-radius:28px;
  overflow:hidden;
  background-color:var(--cream2);
  background-size:cover;
  background-position:center;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:
    0 15px 45px rgba(80,60,30,.10),
    inset 0 0 0 5px rgba(255,255,255,.45);
}

.section-card::before{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(255,250,241,.38);
}

.content-box{
  position:relative;
  z-index:2;
  width:calc(100% - 30px);
  max-width:570px;
  padding:40px 22px;
  text-align:center;
  background:rgba(255,253,249,.78);
  border:1px solid rgba(176,138,69,.45);
  border-radius:22px;
  backdrop-filter:blur(2px);
  box-shadow:0 10px 30px rgba(80,60,30,.08);
}

.gold-line{
  width:75px;
  height:1px;
  background:var(--gold);
  margin:18px auto;
}

.small-title{
  font-size:12px;
  letter-spacing:3px;
  color:var(--gold);
  margin-bottom:14px;
}

h2{
  color:var(--gold);
  font-size:27px;
  font-weight:normal;
  letter-spacing:2px;
  line-height:1.35;
}

p{
  line-height:1.8;
}

.main-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:50px;
  padding:13px 24px;
  border:1px solid var(--gold);
  border-radius:30px;
  background:linear-gradient(135deg,#c8a35d,#a77d35);
  color:white;
  font-size:13px;
  letter-spacing:1.5px;
  text-decoration:none;
  box-shadow:0 7px 18px rgba(120,85,30,.20);
  cursor:pointer;
}

.main-btn:active{
  transform:scale(.98);
}

/* OPENING */

#opening{
  min-height:100svh;
  padding:35px 15px 45px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 15%,#fffdf9 0,#faf6ee 48%,#f1e7d7 100%);
}

.opening-inner{
  width:100%;
  max-width:600px;
  text-align:center;
}

.opening-label{
  color:var(--gold);
  font-size:11px;
  letter-spacing:4px;
  margin-bottom:15px;
}

.opening-title{
  color:var(--gold);
  font-size:36px;
  font-weight:normal;
  letter-spacing:4px;
  margin-bottom:10px;
}

.opening-subtitle{
  font-size:15px;
  line-height:1.7;
  margin-bottom:10px;
}

.hosts{
  font-size:13px;
  color:#8a7658;
  margin-bottom:24px;
}

.opening-video-wrap{
  position:relative;
  width:min(92vw,480px);
  aspect-ratio:9 / 14;
  max-height:62svh;
  margin:0 auto 22px;
  overflow:hidden;
  border-radius:24px;
  border:1px solid rgba(176,138,69,.7);
  background:#f7f0e4;
  box-shadow:
    0 18px 45px rgba(70,50,25,.16),
    inset 0 0 0 5px rgba(255,255,255,.5);
}

#openingVideo{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  background:#f7f0e4;
  transform:scale(1.04);
}

.opening-video-shine{
  position:absolute;
  inset:0;
  pointer-events:none;
  border:5px solid rgba(255,255,255,.22);
  border-radius:24px;
}

.couple-after{
  display:none;
  width:min(92vw,480px);
  margin:0 auto 22px;
  border-radius:24px;
  overflow:hidden;
  border:1px solid rgba(176,138,69,.7);
  background:white;
  box-shadow:0 18px 45px rgba(70,50,25,.14);
}

.couple-after img{
  width:100%;
  display:block;
}

.open-btn{
  margin-top:4px;
}

.open-note{
  margin-top:14px;
  font-size:11px;
  color:#9a876c;
}

/* LOVE STORY */

.love-bg{
  background-image:url("история%20любви.jpg");
}

/* DATE */

.date-bg{
  background-image:url("дата.jpg");
}

.date-number{
  font-size:31px;
  letter-spacing:3px;
  color:var(--gold);
  margin:12px 0;
}

.date-time{
  font-size:24px;
  color:var(--dark);
  letter-spacing:4px;
}

/* VENUE */

.venue-bg{
  background-image:url("almaz.jpg");
}

.venue-name{
  font-size:25px;
  color:var(--gold);
  line-height:1.4;
  margin:10px 0;
}

.address{
  font-size:15px;
  line-height:1.8;
  margin-bottom:22px;
}

/* COUNTDOWN */

.countdown-bg{
  background-image:url("meerim.jpg");
}

.countdown{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin:25px 0;
}

.time-box{
  padding:14px 3px;
  border:1px solid rgba(176,138,69,.5);
  border-radius:12px;
  background:rgba(255,253,249,.85);
}

.time-number{
  display:block;
  color:var(--gold);
  font-size:22px;
  line-height:1.2;
}

.time-label{
  display:block;
  margin-top:5px;
  font-size:9px;
  letter-spacing:1px;
  color:#8d7858;
}

/* RSVP */

.rsvp-bg{
  background-image:url("rsvp.jpg");
}

.rsvp-text{
  font-size:14px;
  margin-bottom:24px;
}

.form-group{
  margin-bottom:14px;
  text-align:left;
}

.form-group label{
  display:block;
  font-size:12px;
  color:var(--gold);
  margin-bottom:6px;
  letter-spacing:.5px;
}

.form-group input,
.form-group select{
  width:100%;
  height:48px;
  padding:0 14px;
  border:1px solid rgba(176,138,69,.45);
  border-radius:12px;
  background:rgba(255,255,255,.9);
  color:var(--dark);
  outline:none;
  font-size:14px;
}

.form-group input:focus,
.form-group select:focus{
  border-color:var(--gold);
}

.radio-row{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.radio-option{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 12px;
  border:1px solid rgba(176,138,69,.3);
  border-radius:10px;
  background:rgba(255,255,255,.75);
  font-size:13px;
}

.radio-option input{
  accent-color:var(--gold);
}

/* FINAL */

.final-bg{
  background-image:url("final.jpg");
  min-height:650px;
}

.final-text{
  font-size:16px;
  line-height:2;
}

.final-names{
  color:var(--gold);
  font-size:25px;
  margin-top:10px;
}

.rose{
  font-size:28px;
  margin-top:16px;
}

/* FOOTER */

footer{
  text-align:center;
  padding:35px 15px 45px;
  color:#a18b6d;
  font-size:11px;
  letter-spacing:1px;
}

/* MOBILE */

@media(max-width:430px){

  section{
    padding:42px 11px;
  }

  .opening-title{
    font-size:30px;
    letter-spacing:3px;
  }

  .opening-subtitle{
