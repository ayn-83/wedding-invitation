<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Элмира & Нурбек — Үйлөнүү тою</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap');

*{box-sizing:border-box;margin:0;padding:0}

:root{
  --cream:#f8f2e8;
  --paper:#fffaf3;
  --gold:#b28a45;
  --gold2:#d7b878;
  --brown:#4b392b;
  --soft:#eadbd0;
}

html{scroll-behavior:smooth}

body{
  background:var(--cream);
  color:var(--brown);
  font-family:'Montserrat',sans-serif;
  overflow-x:hidden;
}

/* ================= ENVELOPE ================= */

#opening{
  position:fixed;
  inset:0;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 30%,#fffdf8 0,#f8f2e8 55%,#eee2d3 100%);
  transition:opacity 1s ease,visibility 1s ease;
}

#opening.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.opening-inner{
  width:100%;
  max-width:430px;
  padding:25px;
  text-align:center;
}

.small-title{
  font-size:12px;
  letter-spacing:4px;
  color:var(--gold);
  margin-bottom:28px;
}

.envelope{
  position:relative;
  width:310px;
  height:205px;
  margin:0 auto 35px;
  perspective:1000px;
  cursor:pointer;
  filter:drop-shadow(0 18px 25px rgba(75,57,43,.18));
}

.env-body{
  position:absolute;
  inset:0;
  background:linear-gradient(145deg,#fffdf8,#eadcc8);
  border:1px solid #d4bd98;
  border-radius:4px;
  overflow:hidden;
}

.env-body:before,
.env-body:after{
  content:"";
  position:absolute;
  bottom:0;
  width:72%;
  height:2px;
  background:#d0b37d;
}

.env-body:before{
  left:-13%;
  transform:rotate(32deg);
}

.env-body:after{
  right:-13%;
  transform:rotate(-32deg);
}

.flap{
  position:absolute;
  z-index:5;
  left:0;
  top:0;
  width:100%;
  height:110px;
  background:linear-gradient(145deg,#fffdf8,#e9d9c4);
  clip-path:polygon(0 0,100% 0,50% 100%);
  transform-origin:top center;
  transition:transform 1.1s cubic-bezier(.4,.1,.2,1);
  border-top:1px solid #d4bd98;
}

.envelope.open .flap{
  transform:rotateX(180deg);
}

.letter{
  position:absolute;
  z-index:3;
  left:18px;
  right:18px;
  top:25px;
  height:170px;
  background:var(--paper);
  border:1px solid var(--gold2);
  transition:transform 1.2s cubic-bezier(.2,.8,.2,1);
  display:flex;
  align-items:center;
  justify-content:center;
}

.envelope.open .letter{
  transform:translateY(-125px);
}

.letter-content{
  text-align:center;
}

.letter-content div:first-child{
  font-family:'Cormorant Garamond',serif;
  font-size:30px;
  color:var(--gold);
}

.letter-content div:last-child{
 font-size:18px;
color:var(--brown);
}
</style>
</head>

<body>

<div class="envelope" id="envelope">
  <div class="letter">
    <div class="letter-content">
      <div>Элмира & Нурбек</div>
      <div>Үйлөнүү тоюна чакырабыз</div>
    </div>
  </div>
</div>

</body>
</html>
